[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app-factory"
version = "0.5.6"
description = "Resilient same-origin frontend chrome for FastAPI, Jinja, HTMX, Alpine, and Basecoat apps"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.115",
    "starlette>=0.37",
]
# platform = fastapi surface for install_platform + product shell.
# Hosts also pin my-auth / my-usermanager per COMPAT.md (BOM). We intentionally
# do not nest those git sources here: my-auth pins app-factory and would
# conflict with this workspace while developing.
platform = [
    "fastapi>=0.115",
    "starlette>=0.37",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "fastapi>=0.115",
    "starlette>=0.37",
]

[tool.hatch.build.targets.wheel]
packages = ["app_factory"]

[tool.hatch.build.targets.sdist]
include = ["app_factory", "README.md", "pyproject.toml"]
