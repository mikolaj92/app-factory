[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app-factory"
version = "0.2.0"
description = "Resilient same-origin frontend chrome for FastAPI, Jinja, HTMX, Alpine, and Basecoat apps"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.115",
    "starlette>=0.37",
]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["app_factory"]

[tool.hatch.build.targets.sdist]
include = ["app_factory", "README.md", "pyproject.toml"]
