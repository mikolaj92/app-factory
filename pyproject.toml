[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app-factory"
version = "0.6.23"
description = "Resilient same-origin frontend chrome for FastAPI, Jinja, HTMX, Alpine, and Basecoat apps"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.141.1",
    "starlette>=1.6.0",
    "python-multipart>=0.0.20",
]
# platform = fastapi surface for install_platform + product shell.
# Hosts also pin my-auth / my-usermanager per COMPAT.md (BOM). We intentionally
# do not nest those git sources here: my-auth pins app-factory and would
# conflict with this workspace while developing.
platform = [
    "fastapi>=0.141.1",
    "starlette>=1.6.0",
    "python-multipart>=0.0.20",
]
dev = [
    "itsdangerous>=2.2",
    "pytest>=8",
    "httpx2>=2.12.0",
    "fastapi>=0.141.1",
    "starlette>=1.6.0",
    "uvicorn[standard]>=0.52.4",
    "python-multipart>=0.0.12",
    "ruff>=0.8",
]
browser = [
    "playwright>=1.49",
    "pytest>=8",
    "httpx2>=2.12.0",
    "fastapi>=0.141.1",
    "starlette>=1.6.0",
    "uvicorn[standard]>=0.52.4",
    "python-multipart>=0.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["app_factory"]

[tool.hatch.build.targets.sdist]
include = ["app_factory", "README.md", "COMPAT.md", "bom", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
