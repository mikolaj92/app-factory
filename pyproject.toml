[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app-factory"
version = "0.7.9"
description = "Language-neutral same-origin chrome files plus a FastAPI/Jinja binding"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.161.1",
    "starlette>=1.9.0",
    "python-multipart>=0.0.32",
]
# platform = fastapi surface for install_platform + product shell.
# Hosts also pin my-auth / my-usermanager per COMPAT.md (BOM). We intentionally
# do not nest those git sources here: my-auth pins app-factory and would
# conflict with this workspace while developing.
platform = [
    "fastapi>=0.161.1",
    "starlette>=1.9.0",
    "python-multipart>=0.0.32",
]
dev = [
    "itsdangerous>=2.2",
    "pytest>=9",
    "httpx2>=2.15.1",
    "fastapi>=0.161.1",
    "starlette>=1.9.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "ruff>=0.16",
    "packaging>=26",
]
browser = [
    "playwright>=1.62",
    "pytest>=9",
    "httpx2>=2.15.1",
    "fastapi>=0.161.1",
    "starlette>=1.9.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
]

[tool.hatch.build.targets.wheel]
packages = ["app_factory"]

[tool.hatch.build.targets.sdist]
include = ["app_factory", "README.md", "COMPAT.md", "bom", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
