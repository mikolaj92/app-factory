[project]
name = "app-factory-multi-user-bom"
version = "0.0.0"
description = "Reference host pinned to the multi-user platform compatibility BOM"
requires-python = ">=3.12"
dependencies = [
  "app-factory[platform]",
  "my-auth[fastapi-htmx]",
  "my-usermanager[fastapi-htmx,myauth]",
  "httpx2>=2.12.0",
  "pytest>=9",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.32",
  "ruff>=0.16",
  "uvicorn[standard]>=0.52.4",
]

[tool.uv]
# Nested adapter uv.sources still declare an older app-factory tag
# (UM v0.6.5 / my-auth v0.5.4). Override app-factory only so the host
# pin (this package, or tag v0.7.0) wins. Do not override my-auth —
# UM v0.6.5 already nests my-auth@v0.5.4.
override-dependencies = [
  "app-factory[platform]",
]

[tool.uv.sources]
# Local editable pin for developing app-factory against released auth tags.
# Production hosts replace this with the immutable git tag from bom/multi_user.toml.
app-factory = { path = "../..", editable = true }
my-auth = { git = "https://github.com/mikolaj92/my-auth", tag = "v0.5.4" }
my-usermanager = { git = "https://github.com/mikolaj92/my-usermanager", tag = "v0.6.5" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
