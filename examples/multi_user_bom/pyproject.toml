[project]
name = "app-factory-multi-user-bom"
version = "0.0.0"
description = "Reference host pinned to the multi-user platform compatibility BOM"
requires-python = ">=3.12"
dependencies = [
  "app-factory[platform]",
  "my-auth[fastapi-htmx]",
  "my-usermanager[fastapi-htmx,myauth]",
  "httpx>=0.27",
  "pytest>=8",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.12",
  "ruff>=0.8",
  "uvicorn[standard]>=0.32",
]

[tool.uv]
# Nested adapter uv.sources still declare app-factory@v0.6.21
# (UM v0.6.2 / my-auth v0.5.1). Override app-factory only so the host
# pin (this package, or tag v0.6.27) wins. Do not override my-auth —
# UM v0.6.2 already nests my-auth@v0.5.1.
override-dependencies = [
  "app-factory[platform]",
]

[tool.uv.sources]
# Local editable pin for developing app-factory against released auth tags.
# Production hosts replace this with the immutable git tag from bom/multi_user.toml.
app-factory = { path = "../..", editable = true }
my-auth = { git = "https://github.com/mikolaj92/my-auth", tag = "v0.5.1" }
my-usermanager = { git = "https://github.com/mikolaj92/my-usermanager", tag = "v0.6.2" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
