[project]
name = "app-factory-multi-user-bom"
version = "0.0.0"
description = "Reference host pinned to the multi-user platform compatibility BOM"
requires-python = ">=3.12"
dependencies = [
  "app-factory[platform]",
  "my-auth[fastapi-htmx]",
  "my-usermanager[fastapi-htmx,myauth]",
  "httpx2>=2.12.0",
  "pytest>=9",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.32",
  "ruff>=0.16",
  "uvicorn[standard]>=0.52.4",
]

[tool.uv]
# The editable development factory wins over nested v0.7.9 pins.
# Do not override my-auth — UM v0.6.10 nests my-auth@v0.5.7.
override-dependencies = [
  "app-factory[platform]",
]

[tool.uv.sources]
# Local editable pin for developing app-factory against released auth tags.
# Production hosts replace this with the immutable git tag from bom/multi_user.toml.
app-factory = { path = "../..", editable = true }
my-auth = { git = "https://github.com/mikolaj92/my-auth", tag = "v0.5.7" }
my-usermanager = { git = "https://github.com/mikolaj92/my-usermanager", tag = "v0.6.10" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
