[project]
name = "app-factory-multi-user-bom"
version = "0.0.0"
description = "Reference host pinned to the multi-user platform compatibility BOM"
requires-python = ">=3.12"
dependencies = [
  "app-factory[platform]",
  "my-auth[fastapi-htmx]",
  "my-usermanager[fastapi-htmx,myauth]",
  "httpx>=0.27",
  "pytest>=8",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.32",
]

[tool.uv]
# Nested adapter uv.sources pin older app-factory and my-auth tags
# (UM v0.5.2 still sources my-auth@v0.4.0). Override so resolution
# selects this BOM's app-factory + my-auth sources.
override-dependencies = [
  "app-factory[platform]",
  "my-auth[fastapi-htmx]",
]

[tool.uv.sources]
# Local editable pin for developing app-factory against released auth tags.
# Production hosts replace this with the immutable git tag from bom/multi_user.toml.
app-factory = { path = "../..", editable = true }
my-auth = { git = "https://github.com/mikolaj92/my-auth", tag = "v0.4.1" }
my-usermanager = { git = "https://github.com/mikolaj92/my-usermanager", tag = "v0.5.2" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
