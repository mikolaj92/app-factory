{# Early theme FOUC guard — set window.appTheme (host may alias product name). #}
<script>
(() => {
  const media = window.matchMedia('(prefers-color-scheme: dark)');
  const validModes = new Set(['light', 'dark', 'auto']);
  const serverMode = document.documentElement.dataset.theme;
  let mode = validModes.has(serverMode) ? serverMode : 'auto';
  try {
    const stored = localStorage.getItem('themeMode');
    if (validModes.has(stored)) mode = stored;
  } catch (_) {}
  const isDark = () => mode === 'dark' || (mode === 'auto' && media.matches);
  const updateControls = () => {
    document.querySelectorAll('[data-theme]').forEach((control) => {
      control.setAttribute('aria-pressed', String(control.dataset.theme === mode));
    });
    document.querySelectorAll('[data-theme-toggle]').forEach((control) => {
      control.setAttribute('aria-pressed', String(mode === 'dark'));
    });
  };
  const apply = (value, persist = true) => {
    if (value === 'toggle') {
      mode = isDark() ? 'light' : 'dark';
    } else {
      mode = validModes.has(value) ? value : 'auto';
    }
    document.documentElement.classList.toggle('dark', isDark());
    document.documentElement.dataset.theme = isDark() ? 'dark' : 'light';
    if (persist) {
      try { localStorage.setItem('themeMode', mode); } catch (_) {}
    }
    updateControls();
  };
  window.appTheme = {
    get mode() { return mode; },
    set: (value) => apply(value),
    toggle: () => apply(isDark() ? 'light' : 'dark'),
    refresh: updateControls,
  };
  apply(mode, false);
  media.addEventListener?.('change', () => {
    if (mode === 'auto') apply('auto', false);
  });
  document.addEventListener('basecoat:theme', (event) => {
    const requested = event.detail?.mode;
    if (!requested || requested === 'toggle') window.appTheme.toggle();
    else window.appTheme.set(requested);
  });
  document.addEventListener('basecoat:themechange', (event) => {
    const requested = event.detail?.mode;
    if (requested === 'dark' || requested === 'light') window.appTheme.set(requested);
  });
  document.addEventListener('click', (event) => {
    const control = event.target.closest?.('[data-theme], [data-theme-toggle]');
    if (!control) return;
    event.preventDefault();
    const requested = control.dataset.theme;
    if (requested) window.appTheme.set(requested);
    else window.appTheme.toggle();
  });
  // Locale dropdown: navigate when option has data-href (server i18n),
  // otherwise emit platform:locale for client-side hosts (e.g. emitype).
  document.addEventListener('change', (event) => {
    const picker = event.target && event.target.closest
      ? event.target.closest('[data-platform-locale-picker]')
      : null;
    if (!picker || String(picker.tagName || '').toUpperCase() !== 'SELECT') return;
    const opt = picker.selectedOptions && picker.selectedOptions[0];
    if (!opt) return;
    const href = opt.getAttribute('data-href');
    const code = picker.value;
    if (href) {
      window.location.assign(href);
      return;
    }
    if (code) {
      document.dispatchEvent(new CustomEvent('platform:locale', { detail: { code } }));
    }
  });
})();
</script>
