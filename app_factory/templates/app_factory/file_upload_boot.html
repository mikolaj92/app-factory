{# Shared upload controller. HTMX owns transport; hosts own validation and responses. #}
<script>
(() => {
  if (window.__appFileUploadBooted) return;
  window.__appFileUploadBooted = true;

  const formatBytes = (bytes) => {
    if (!Number.isFinite(bytes)) return '';
    const units = ['B', 'KiB', 'MiB', 'GiB'];
    let value = bytes;
    let unit = 0;
    while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit += 1; }
    return `${value >= 10 || unit === 0 ? Math.round(value) : value.toFixed(1)} ${units[unit]}`;
  };

  const accepts = (file, raw) => {
    const tokens = String(raw || '').split(',').map((part) => part.trim().toLowerCase()).filter(Boolean);
    if (!tokens.length) return true;
    const name = String(file.name || '').toLowerCase();
    const type = String(file.type || '').toLowerCase();
    return tokens.some((token) => token.startsWith('.') ? name.endsWith(token) : token.endsWith('/*') ? type.startsWith(token.slice(0, -1)) : type === token);
  };

  const message = (template, values) => Object.entries(values).reduce(
    (text, [key, value]) => text.replaceAll(`{${key}}`, String(value)), String(template || '')
  );

  const forms = new WeakMap();
  const initForm = (form) => {
    if (forms.has(form)) return forms.get(form);
    const validators = new Map();
    const validate = (event) => {
      if (event.defaultPrevented) return false;
      for (const [field, check] of validators) {
        if (field.isConnected && field.closest('form') === form && !check()) {
          event.preventDefault();
          return false;
        }
      }
      const confirmed = form.querySelector('[data-app-file-confirmed-count]');
      if (confirmed) confirmed.value = String(Array.from(form.querySelectorAll('[data-app-file-input]')).reduce((count, input) => count + (input.files?.length || 0), 0));
      return true;
    };
    const reset = () => {
      const inputs = Array.from(form.querySelectorAll('[data-app-file-input]'));
      const submit = form.querySelector('[data-app-file-submit]');
      if (submit) {
        submit.removeAttribute('aria-busy');
        submit.disabled = inputs.some((input) => input.required && !input.files?.length);
      }
      const progress = form.querySelector('[data-app-file-progress]');
      const bar = form.querySelector('[data-app-file-progress-bar]');
      const label = form.querySelector('[data-app-file-progress-label]');
      if (progress) progress.hidden = true;
      if (bar) bar.value = 0;
      if (label) label.textContent = '0%';
    };
    form.addEventListener('submit', (event) => {
      if (!validate(event)) event.stopImmediatePropagation();
    }, true);
    const beforeRequest = (event) => {
      initAll(form);
      if (!validate(event)) { reset(); return; }
      const body = event.detail.ctx.request.body;
      if (body instanceof FormData) {
        const inputs = Array.from(form.querySelectorAll('[data-app-file-input]')).filter((input) => input.name && !input.matches(':disabled'));
        new Set(inputs.map((input) => input.name)).forEach((name) => body.delete(name));
        inputs.forEach((input) => Array.from(input.files || []).forEach((file) => body.append(input.name, file)));
        form.querySelectorAll('[data-app-file-confirmed-count][name]').forEach((input) => body.set(input.name, input.value));
      }
      const submit = form.querySelector('[data-app-file-submit]');
      const progress = form.querySelector('[data-app-file-progress]');
      const bar = form.querySelector('[data-app-file-progress-bar]');
      const label = form.querySelector('[data-app-file-progress-label]');
      if (submit) { submit.disabled = true; submit.setAttribute('aria-busy', 'true'); }
      if (progress) progress.hidden = false;
      if (bar) bar.removeAttribute('value');
      if (label) label.textContent = '';
    };
    const state = { validators, reset, beforeRequest };
    forms.set(form, state);
    return state;
  };

  const init = (field) => {
    if (!field || field.dataset.appFileUploadReady === 'true') return;
    field.dataset.appFileUploadReady = 'true';
    const form = field.closest('form');
    if (!form) return;
    const input = field.querySelector('[data-app-file-input]');
    const dropzone = field.querySelector('[data-app-file-dropzone]');
    const list = field.querySelector('[data-app-file-list]');
    const status = form.querySelector('[data-app-file-status]');
    const confirmed = form.querySelector('[data-app-file-confirmed-count]');
    if (!input) return;
    const state = initForm(form);
    let confirmedFiles = [];

    const setStatus = (text, state = '') => {
      if (!status) return;
      status.textContent = text || '';
      if (state) status.dataset.state = state; else delete status.dataset.state;
    };

    const setFiles = (files) => {
      const transfer = new DataTransfer();
      files.forEach((file) => transfer.items.add(file));
      input.files = transfer.files;
    };

    const render = () => {
      const files = Array.from(input.files || []);
      if (list) {
        list.replaceChildren(...files.map((file, index) => {
          const item = document.createElement('li');
          item.className = 'l--cluster app-cluster--between text-sm';
          const label = document.createElement('span');
          label.className = 'min-w-0 break-words';
          label.textContent = `${file.name} · ${formatBytes(file.size)}`;
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'btn';
          remove.dataset.variant = 'ghost';
          remove.dataset.size = 'sm';
          remove.textContent = field.dataset.removeLabel || 'Remove';
          remove.addEventListener('click', () => { setFiles(files.filter((_file, i) => i !== index)); render(); });
          item.append(label, remove);
          return item;
        }));
      }
      state.reset();
      confirmedFiles = [];
      if (confirmed) confirmed.value = '';
      setStatus('');
    };

    input.addEventListener('change', render);
    if (dropzone) {
      dropzone.addEventListener('drop', (event) => {
        if (!event.dataTransfer) return;
        setFiles(Array.from(event.dataTransfer.files));
        render();
      });
    }

    const validate = () => {
      const files = Array.from(input.files || []);
      if (!files.length && input.required) { setStatus(field.dataset.labelEmpty, 'error'); return false; }
      const max = Number.parseInt(field.dataset.maxBytes || '', 10);
      const oversized = Number.isFinite(max) ? files.filter((file) => file.size > max) : [];
      if (oversized.length) { setStatus(message(field.dataset.labelTooLarge, { file: oversized.map((f) => f.name).join(', ') }), 'error'); return false; }
      const wrong = files.filter((file) => !accepts(file, field.dataset.accept));
      if (wrong.length) { setStatus(message(field.dataset.labelWrongType, { file: wrong.map((f) => f.name).join(', ') }), 'error'); return false; }
      if (files.length > 1 && confirmed && (files.length !== confirmedFiles.length || files.some((file, index) => file !== confirmedFiles[index]))) {
        if (!window.confirm(message(field.dataset.labelConfirm, { count: files.length }))) return false;
        confirmedFiles = files;
      }
      return true;
    };
    state.validators.set(field, validate);
    render();
  };

  const initAll = (root = document) => {
    if (root.matches?.('[data-app-file-upload-field]')) init(root);
    root.querySelectorAll?.('[data-app-file-upload-field]').forEach(init);
  };
  document.addEventListener('htmx:before:request', (event) => {
    forms.get(event.detail?.ctx?.request?.form)?.beforeRequest(event);
  });
  for (const name of ['htmx:after:request', 'htmx:finally:request']) {
    document.addEventListener(name, (event) => {
      forms.get(event.detail?.ctx?.request?.form)?.reset();
    });
  }
  document.addEventListener('DOMContentLoaded', () => initAll());
  document.addEventListener('htmx:after:swap', (event) => {
    const ctx = event.detail && event.detail.ctx;
    initAll((ctx && (ctx.target || ctx.sourceElement)) || document);
  });
  if (document.readyState !== 'loading') initAll();
})();
</script>
