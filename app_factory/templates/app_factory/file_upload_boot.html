<script>
(() => {
  if (window.__appFileUploadBooted) return;
  window.__appFileUploadBooted = true;
  const forms = new WeakMap();

  const formatBytes = (bytes) => {
    if (!Number.isFinite(bytes)) return '';
    const units = ['B', 'KiB', 'MiB', 'GiB'];
    let value = bytes;
    let unit = 0;
    while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit += 1; }
    return `${value >= 10 || unit === 0 ? Math.round(value) : value.toFixed(1)} ${units[unit]}`;
  };

  const accepts = (file, raw) => {
    const tokens = String(raw || '').split(',').map((part) => part.trim().toLowerCase()).filter(Boolean);
    if (!tokens.length) return true;
    const name = String(file.name || '').toLowerCase();
    const type = String(file.type || '').toLowerCase();
    return tokens.some((token) => token.startsWith('.') ? name.endsWith(token) : token.endsWith('/*') ? type.startsWith(token.slice(0, -1)) : type === token);
  };

  const message = (template, values) => Object.entries(values).reduce(
    (text, [key, value]) => text.replaceAll(`{${key}}`, String(value)), String(template || '')
  );

  const initForm = (form) => {
    if (forms.has(form)) return forms.get(form);
    const fields = () => Array.from(form.querySelectorAll('[data-app-file-upload-field]'))
      .filter((field) => field.closest('form') === form);
    const status = () => form.querySelector('[data-app-file-status]');
    const confirmed = () => form.querySelector('[data-app-file-confirmed-count]');
    const setStatus = (text, state = '') => {
      const element = status();
      if (!element) return;
      element.textContent = text || '';
      if (state) element.dataset.state = state; else delete element.dataset.state;
    };
    const setBusy = (busy) => {
      const submit = form.querySelector('[data-app-file-submit]');
      if (submit) {
        submit.disabled = busy || fields().some((field) => {
          const input = field.querySelector('[data-app-file-input]');
          return input?.required && !input.files?.length;
        });
        if (busy) submit.setAttribute('aria-busy', 'true'); else submit.removeAttribute('aria-busy');
      }
      const progress = form.querySelector('[data-app-file-progress]');
      const bar = form.querySelector('[data-app-file-progress-bar]');
      const label = form.querySelector('[data-app-file-progress-label]');
      if (progress) progress.hidden = !busy;
      if (bar) { if (busy) bar.removeAttribute('value'); else bar.value = 0; }
      if (label) label.textContent = busy ? '' : '0%';
    };
    const validate = () => {
      const reject = (error) => { setStatus(error, 'error'); return false; };
      for (const field of fields()) {
        const input = field.querySelector('[data-app-file-input]');
        if (!input) continue;
        const files = Array.from(input.files || []);
        if (!files.length && input.required) return reject(field.dataset.labelEmpty);
        const max = Number.parseInt(field.dataset.maxBytes || '', 10);
        const oversized = Number.isFinite(max) ? files.filter((file) => file.size > max) : [];
        if (oversized.length) return reject(message(field.dataset.labelTooLarge, { file: oversized.map((file) => file.name).join(', ') }));
        const wrong = files.filter((file) => !accepts(file, field.dataset.accept));
        if (wrong.length) return reject(message(field.dataset.labelWrongType, { file: wrong.map((file) => file.name).join(', ') }));
      }
      setStatus('');
      return true;
    };
    const confirmBatch = () => {
      const count = fields().reduce((total, field) => total + (field.querySelector('[data-app-file-input]')?.files?.length || 0), 0);
      const marker = confirmed();
      if (count <= 1 || !marker || marker.value === String(count)) return true;
      const field = fields().find((field) => field.dataset.labelConfirm);
      if (!window.confirm(message(field?.dataset.labelConfirm, { count }))) return false;
      marker.value = String(count);
      return true;
    };
    const ownsRequest = (event) => {
      const ctx = event.detail?.ctx;
      const source = ctx?.sourceElement;
      return ctx?.request?.form === form && (source === form ||
        (source?.form === form && source.matches('button[type="submit"], button:not([type]), input[type="submit"], input[type="image"]')));
    };
    const rejectedSubmits = new WeakSet();
    form.addEventListener('submit', (event) => {
      if (event.target !== form) return;
      if (!validate() || (!event.defaultPrevented && !confirmBatch())) {
        rejectedSubmits.add(event);
        event.preventDefault();
      }
    }, true);
    form.addEventListener('htmx:config:request', (event) => {
      if (!ownsRequest(event)) return;
      if (!validate() || rejectedSubmits.has(event.detail.ctx.sourceEvent) || (!event.defaultPrevented && !confirmBatch())) event.preventDefault();
      if (!event.defaultPrevented && confirmed()) event.detail.ctx.request.body.set(confirmed().name, confirmed().value);
    });
    form.addEventListener('htmx:before:request', (event) => {
      if (!ownsRequest(event)) return;
      queueMicrotask(() => { if (!event.defaultPrevented) setBusy(true); });
    });
    for (const name of ['htmx:after:request', 'htmx:finally:request']) {
      form.addEventListener(name, (event) => { if (ownsRequest(event)) setBusy(false); });
    }
    const changed = () => {
      if (confirmed()) confirmed().value = '';
      setStatus('');
      setBusy(false);
    };
    forms.set(form, changed);
    return changed;
  };

  const init = (field) => {
    if (!field || field.dataset.appFileUploadReady === 'true') return;
    const form = field.closest('form');
    const input = field.querySelector('[data-app-file-input]');
    if (!form || !input) return;
    field.dataset.appFileUploadReady = 'true';
    const changed = initForm(form);
    const dropzone = field.querySelector('[data-app-file-dropzone]');
    const list = field.querySelector('[data-app-file-list]');
    const setFiles = (files) => {
      const transfer = new DataTransfer();
      files.forEach((file) => transfer.items.add(file));
      input.files = transfer.files;
    };
    const render = () => {
      const files = Array.from(input.files || []);
      if (list) {
        list.replaceChildren(...files.map((file, index) => {
          const item = document.createElement('li');
          item.className = 'l--cluster app-cluster--between text-sm';
          const label = document.createElement('span');
          label.className = 'min-w-0 break-words';
          label.textContent = `${file.name} · ${formatBytes(file.size)}`;
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'btn';
          remove.dataset.variant = 'ghost';
          remove.dataset.size = 'sm';
          remove.textContent = field.dataset.removeLabel || 'Remove';
          remove.addEventListener('click', () => { setFiles(files.filter((_file, i) => i !== index)); render(); });
          item.append(label, remove);
          return item;
        }));
      }
      changed();
    };
    input.addEventListener('change', render);
    if (dropzone) {
      dropzone.addEventListener('drop', (event) => {
        if (!event.dataTransfer) return;
        event.preventDefault();
        setFiles(Array.from(event.dataTransfer.files));
        render();
      });
    }
    render();
  };

  const initAll = (root = document) => {
    if (root.matches?.('[data-app-file-upload-field]')) init(root);
    root.querySelectorAll?.('[data-app-file-upload-field]').forEach(init);
  };
  document.addEventListener('DOMContentLoaded', () => initAll());
  document.addEventListener('htmx:after:swap', (event) => {
    const ctx = event.detail && event.detail.ctx;
    initAll((ctx && (ctx.target || ctx.sourceElement)) || document);
  });
  if (document.readyState !== 'loading') initAll();
})();
</script>
