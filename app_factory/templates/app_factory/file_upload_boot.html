<script>
(() => {
  if (window.__appFileUploadBooted) return;
  window.__appFileUploadBooted = true;

  const formatBytes = (bytes) => {
    if (!Number.isFinite(bytes)) return '';
    const units = ['B', 'KiB', 'MiB', 'GiB'];
    let value = bytes;
    let unit = 0;
    while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit += 1; }
    return `${value >= 10 || unit === 0 ? Math.round(value) : value.toFixed(1)} ${units[unit]}`;
  };

  const accepts = (file, raw) => {
    const tokens = String(raw || '').split(',').map((part) => part.trim().toLowerCase()).filter(Boolean);
    if (!tokens.length) return true;
    const name = String(file.name || '').toLowerCase();
    const type = String(file.type || '').toLowerCase();
    return tokens.some((token) => token.startsWith('.') ? name.endsWith(token) : token.endsWith('/*') ? type.startsWith(token.slice(0, -1)) : type === token);
  };

  const message = (template, values) => Object.entries(values).reduce(
    (text, [key, value]) => text.replaceAll(`{${key}}`, String(value)), String(template || '')
  );
  const inputs = (form) => Array.from(form.elements).filter((input) =>
    input.form === form && input.matches('[data-app-file-input]') && !input.matches(':disabled')
  );
  const control = (form, selector) => Array.from(form.elements).find((element) => element.matches(selector)) ||
    Array.from(form.querySelectorAll(selector)).find((element) => !element.form || element.form === form);
  const setStatus = (form, text, state = '') => {
    const status = control(form, '[data-app-file-status]');
    if (!status) return;
    status.textContent = text || '';
    if (state) status.dataset.state = state; else delete status.dataset.state;
  };
  const clearConfirmation = (form) => {
    const confirmed = control(form, '[data-app-file-confirmed-count]');
    if (confirmed) confirmed.value = '';
  };
  const reset = (form) => {
    const submit = control(form, '[data-app-file-submit]');
    const progress = control(form, '[data-app-file-progress]');
    const bar = control(form, '[data-app-file-progress-bar]');
    const label = control(form, '[data-app-file-progress-label]');
    if (submit) {
      submit.removeAttribute('aria-busy');
      submit.disabled = inputs(form).some((input) => input.required && !input.files.length);
    }
    if (progress) progress.hidden = true;
    if (bar) bar.value = 0;
    if (label) label.textContent = '0%';
    clearConfirmation(form);
  };
  const validate = (form, event) => {
    clearConfirmation(form);
    if (event.defaultPrevented) { reset(form); return false; }
    let count = 0;
    let batchField;
    for (const input of inputs(form)) {
      const field = input.closest('[data-app-file-upload-field]');
      if (!field) continue;
      const files = Array.from(input.files || []);
      count += files.length;
      if (field.dataset.labelConfirm) batchField ||= field;
      let error;
      if (!files.length && input.required) error = field.dataset.labelEmpty;
      const max = Number.parseInt(field.dataset.maxBytes || '', 10);
      const oversized = Number.isFinite(max) ? files.filter((file) => file.size > max) : [];
      const wrong = files.filter((file) => !accepts(file, field.dataset.accept));
      if (oversized.length) error = message(field.dataset.labelTooLarge, { file: oversized.map((file) => file.name).join(', ') });
      else if (wrong.length) error = message(field.dataset.labelWrongType, { file: wrong.map((file) => file.name).join(', ') });
      if (error !== undefined) {
        event.preventDefault();
        reset(form);
        setStatus(form, error, 'error');
        return false;
      }
    }
    const confirmed = control(form, '[data-app-file-confirmed-count]');
    if (count > 1 && confirmed && batchField) {
      if (!window.confirm(message(batchField.dataset.labelConfirm, { count }))) {
        event.preventDefault();
        reset(form);
        return false;
      }
      confirmed.value = String(count);
    }
    setStatus(form, '');
    return true;
  };
  const requestForm = (event) => event.detail?.ctx?.request?.form;
  document.addEventListener('submit', (event) => {
    const form = event.target;
    if (form instanceof HTMLFormElement && inputs(form).length && !event.defaultPrevented) validate(form, event);
  });
  document.addEventListener('htmx:before:request', (event) => {
    const form = requestForm(event);
    if (!form || !Array.from(form.elements).some((input) => input.form === form && input.matches('[data-app-file-input]'))) return;
    if (!validate(form, event)) return;
    const body = event.detail.ctx.request.body;
    if (body instanceof FormData) {
      const managed = Array.from(form.elements).filter((input) => input.form === form && input.matches('[data-app-file-input]'));
      const names = new Set(managed.map((input) => input.name).filter(Boolean));
      for (const name of names) {
        const retained = body.getAll(name).filter((value) => !(value instanceof File));
        body.delete(name);
        retained.forEach((value) => body.append(name, value));
      }
      for (const input of Array.from(form.elements).filter((input) =>
        input.form === form && input.type === 'file' && names.has(input.name) && !input.matches(':disabled')
      )) {
        if (!input.name) continue;
        const files = Array.from(input.files || []);
        if (!files.length) files.push(new File([], '', { type: 'application/octet-stream' }));
        files.forEach((file) => body.append(input.name, file));
      }
      const confirmed = control(form, '[data-app-file-confirmed-count]');
      if (confirmed?.name && !confirmed.matches(':disabled')) body.set(confirmed.name, confirmed.value);
    }
    const submit = control(form, '[data-app-file-submit]');
    const progress = control(form, '[data-app-file-progress]');
    const bar = control(form, '[data-app-file-progress-bar]');
    const label = control(form, '[data-app-file-progress-label]');
    if (submit) { submit.disabled = true; submit.setAttribute('aria-busy', 'true'); }
    if (progress) progress.hidden = false;
    if (bar) bar.removeAttribute('value');
    if (label) label.textContent = '';
  });
  for (const name of ['htmx:after:request', 'htmx:finally:request']) {
    document.addEventListener(name, (event) => {
      const form = requestForm(event);
      if (form) reset(form);
    });
  }

  const init = (field) => {
    if (!field || field.dataset.appFileUploadReady === 'true') return;
    const input = field.querySelector('[data-app-file-input]');
    if (!input?.form) return;
    field.dataset.appFileUploadReady = 'true';
    const dropzone = field.querySelector('[data-app-file-dropzone]');
    const list = field.querySelector('[data-app-file-list]');
    const setFiles = (files) => {
      const transfer = new DataTransfer();
      files.forEach((file) => transfer.items.add(file));
      input.files = transfer.files;
    };
    const render = () => {
      const files = Array.from(input.files || []);
      if (list) {
        list.replaceChildren(...files.map((file, index) => {
          const item = document.createElement('li');
          item.className = 'l--cluster app-cluster--between text-sm';
          const label = document.createElement('span');
          label.className = 'min-w-0 break-words';
          label.textContent = `${file.name} · ${formatBytes(file.size)}`;
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'btn';
          remove.dataset.variant = 'ghost';
          remove.dataset.size = 'sm';
          remove.textContent = field.dataset.removeLabel || 'Remove';
          remove.addEventListener('click', () => { setFiles(files.filter((_file, i) => i !== index)); render(); });
          item.append(label, remove);
          return item;
        }));
      }
      reset(input.form);
      setStatus(input.form, '');
    };
    input.addEventListener('change', render);
    if (dropzone) {
      dropzone.addEventListener('drop', (event) => {
        if (!event.dataTransfer || input.matches(':disabled')) return;
        setFiles(Array.from(event.dataTransfer.files));
        render();
      });
    }
    render();
  };
  const initAll = (root = document) => {
    if (root.matches?.('[data-app-file-upload-field]')) init(root);
    root.querySelectorAll?.('[data-app-file-upload-field]').forEach(init);
  };
  document.addEventListener('DOMContentLoaded', () => initAll());
  document.addEventListener('htmx:after:swap', (event) => {
    const ctx = event.detail && event.detail.ctx;
    initAll((ctx && (ctx.target || ctx.sourceElement)) || document);
  });
  if (document.readyState !== 'loading') initAll();
})();
</script>
