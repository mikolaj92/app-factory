{# Sidebar foot is guest-only. Signed-in identity lives in the main header. #}
<div class="app-stack app-stack--tight w-full" data-platform-auth>
  {% if not platform_user %}
  <a
    class="btn w-full"
    data-variant="primary"
    data-size="sm"
    href="{{ platform_paths.login }}"
    data-no-htmx="true"
  >
    Login
  </a>
  {% if platform_show_register %}
  <a
    class="btn w-full"
    data-variant="ghost"
    data-size="sm"
    href="{{ platform_paths.register }}"
    data-no-htmx="true"
  >
    Register
  </a>
  {% endif %}
  {% endif %}
</div>
