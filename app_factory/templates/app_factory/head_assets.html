{# Shared head: locally bundled core assets, configured by install_app_factory_ui(). #}
<link rel="stylesheet" href="{{ platform_asset_url('basecoat-css') }}">
<link rel="stylesheet" href="{{ platform_asset_url('material-symbols-css') }}">
{% if product_css_url is defined and product_css_url %}
<link rel="stylesheet" href="{{ product_css_url }}">
{% endif %}
<script src="{{ platform_asset_url('basecoat-js-all') }}" defer></script>
<script src="{{ platform_asset_url('htmx') }}"></script>
<script src="{{ platform_asset_url('alpine') }}" defer></script>
<script>
  document.addEventListener('htmx:configRequest', function (event) {
    if (event.detail && event.detail.xhr) {
      event.detail.xhr.withCredentials = true;
    }
  });
  document.addEventListener('htmx:responseError', (event) => {
    const status = event?.detail?.xhr?.status;
    if (status === 401) {
      window.location.href = {{ (login_url if login_url is defined else '/login') | tojson }};
    }
  });
  // After HTMX swaps a fragment, re-init Alpine trees inside it (x-data/x-show).
  document.addEventListener('htmx:afterSwap', function (event) {
    var elt = event.detail && event.detail.elt;
    if (!elt || typeof window.Alpine === 'undefined' || !window.Alpine.initTree) {
      return;
    }
    window.Alpine.initTree(elt);
  });
</script>
