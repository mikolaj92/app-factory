{# End-session control for account / profile / preferences pages only.
   Hosts include this on the signed-in account surface — never in chrome foot. #}
<section class="card" data-platform-session aria-labelledby="platform-session-title">
  <header>
    <h2 id="platform-session-title" class="text-lg font-semibold">{{ platform_session_title | default("Session") }}</h2>
    <p class="text-sm text-muted-foreground">
      {{ platform_session_description | default("Sign out of this app on this device.") }}
    </p>
  </header>
  <footer>
    <form method="post" action="{{ platform_paths.logout }}" data-no-htmx="true">
      <button type="submit" class="btn" data-variant="destructive" data-size="sm">
        {{ platform_logout_label | default("Log out") }}
      </button>
    </form>
  </footer>
</section>
