name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      UV_PROJECT_ENVIRONMENT: .venv
      UV_NO_ENV_FILE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check all projects
        shell: bash
        run: |
          set -o pipefail
          root="$PWD"
          browser_path="${PLAYWRIGHT_BROWSERS_PATH-$root/.runtime/ms-playwright}"
          exec > >(tee "$RUNNER_TEMP/project-checks.log") 2>&1
          failed=0
          check() {
            local stage="$1"
            shift
            if "$@"; then status=0; else status=$?; failed=1; fi
            printf 'PROJECT_CHECK cwd=%s stage=%s exit_code=%s\n' "$PWD" "$stage" "$status"
          }
          packages=("$root")
          for manifest in "$root"/examples/*/pyproject.toml; do
            [[ -f "$manifest" ]] && packages+=("${manifest%/pyproject.toml}")
          done
          for package in "${packages[@]}"; do
            cd "$package"
            export UV_PROJECT_ENVIRONMENT="$package/.venv"
            printf 'LOKAY_TEST_CWD=%s\n' "$PWD"
            check lock uv lock --check
            check sync uv sync --locked --all-extras
            if [[ "$status" != 0 ]]; then
              stages=(ruff pytest)
              if [[ "$package" == "$root" ]]; then stages+=(browser http build); fi
              for stage in "${stages[@]}"; do
                printf 'PROJECT_CHECK cwd=%s stage=%s status=not-run reason=sync-failed\n' "$PWD" "$stage"
              done
              continue
            fi
            if [[ "$package" == "$root" ]]; then
              browser_args=(chromium)
              if [[ "$(uname -s)" == Linux ]]; then browser_args=(--with-deps chromium); fi
              check browser env PLAYWRIGHT_BROWSERS_PATH="$browser_path" uv run --no-sync playwright install "${browser_args[@]}"
            fi
            check ruff uv run --no-sync ruff check .
            check pytest uv run --no-sync pytest
            if [[ "$package" == "$root" ]]; then
              check http uv run --no-sync python scripts/refresh_platform_assets.py --check-http-releases
              check build uv build
            fi
          done
          printf 'PROJECT_CHECK_RESULT=%s\n' "$failed"
          exit "$failed"
      - name: Upload project check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-tests-${{ github.sha }}-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/project-checks.log
          if-no-files-found: error
