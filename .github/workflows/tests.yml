name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv lock --check
      - run: uv lock --check --project examples/multi_user_bom
      - run: uv sync --locked --extra dev --extra browser
      - run: uv run --locked python scripts/refresh_platform_assets.py --check-http-releases
      - run: uv run --locked playwright install --with-deps chromium
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q
        working-directory: examples/multi_user_bom
      - run: uv build
