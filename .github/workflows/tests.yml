name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check root lock
        run: uv lock --check
      - name: Check BOM lock
        run: uv lock --check
        working-directory: examples/multi_user_bom
      - name: Install root extras
        run: uv sync --frozen --all-extras
      - name: Install BOM dependencies
        run: uv sync --frozen --all-extras
        working-directory: examples/multi_user_bom
      - run: uv run --locked python scripts/refresh_platform_assets.py --check-http-releases
      - run: uv run --locked playwright install --with-deps chromium
      - name: Test root project
        run: uv run --locked pytest -q
      - run: uv run --locked ruff check .
      - name: Test BOM project
        run: uv run --locked pytest -q
        working-directory: examples/multi_user_bom
      - run: uv build
