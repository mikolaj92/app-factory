name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      # Resolve against each project, never reuse an inherited root environment.
      UV_PROJECT_ENVIRONMENT: .venv
      UV_NO_ENV_FILE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check root lock
        run: uv lock --check
      - name: Check BOM lock
        if: ${{ !cancelled() }}
        run: uv lock --check
        working-directory: examples/multi_user_bom
      - name: Install root extras
        if: ${{ !cancelled() }}
        run: uv sync --locked --all-extras
      - run: uv run --locked --all-extras playwright install --with-deps chromium
        if: ${{ !cancelled() }}
      - name: Check all projects
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_projects.py 2>&1 | tee "$RUNNER_TEMP/project-tests.log"
      - name: Upload project test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-tests-${{ github.sha }}-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/project-tests.log
          if-no-files-found: error
      # Independent checks must still report failures after either suite fails.
      - name: Check stable HTTP releases
        if: ${{ !cancelled() }}
        run: uv run --locked python scripts/refresh_platform_assets.py --check-http-releases
      - name: Lint
        if: ${{ !cancelled() }}
        run: uv run --locked ruff check .
      - name: Build
        if: ${{ !cancelled() }}
        run: uv build
