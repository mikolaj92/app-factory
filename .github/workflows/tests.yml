name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Resolve against each project, never reuse an inherited root environment.
      UV_PROJECT_ENVIRONMENT: .venv
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check root lock
        run: uv lock --check
      - name: Check BOM lock
        run: uv lock --check
        working-directory: examples/multi_user_bom
      - name: Install root extras
        run: uv sync --frozen --all-extras
      - name: Install BOM dependencies
        run: uv sync --frozen --all-extras
        working-directory: examples/multi_user_bom
      - run: uv run --locked python scripts/refresh_platform_assets.py --check-http-releases
      - run: uv run --locked playwright install --with-deps chromium
      - name: Test both projects
        shell: bash
        run: |
          set -o pipefail
          uv run --locked python scripts/run_projects.py 2>&1 | tee "$RUNNER_TEMP/project-tests.log"
      - name: Upload project test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-tests-${{ github.sha }}
          path: ${{ runner.temp }}/project-tests.log
          if-no-files-found: error
      - run: uv run --locked ruff check .
      - run: uv build
